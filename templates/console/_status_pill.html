{% comment %}Usage: {% include "console/_status_pill.html" with status=order.status label=order.get_status_display %}{% endcomment %}
<span class="inline-block rounded-full px-2.5 py-1 text-[10.5px] font-semibold uppercase tracking-[0.06em]
  {% if status == 'pending' or status == 'new' %}bg-amber-100 text-amber-800
  {% elif status == 'confirmed' or status == 'quoted' %}bg-blue-100 text-blue-800
  {% elif status == 'delivered' or status == 'won' %}bg-emerald-100 text-emerald-800
  {% elif status == 'cancelled' or status == 'lost' or status == 'unpaid' %}bg-ember/10 text-ember-dark
  {% else %}bg-ink/10 text-ink/60{% endif %}">
  {{ label }}
</span>
