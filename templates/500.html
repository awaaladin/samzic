<!DOCTYPE html>
<!--
  Deliberately standalone: no template inheritance, no context processors, no URL
  reversing. If something is broken badly enough to raise a 500, the base template
  and its context may be part of what's broken.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server error</title>
  <style>
    body { margin:0; min-height:100vh; background:#F4F2EF; color:#141414;
           font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
           -webkit-font-smoothing:antialiased; display:flex; align-items:center;
           justify-content:center; }
    .stage { width:min(94vw,52rem); padding:1.5rem; }
    .panel { position:relative; overflow:hidden; border-radius:2rem; border:1px solid rgba(20,20,20,.08);
             background:#ffffff; box-shadow:0 42px 105px -60px rgba(20,20,20,.28); padding:3rem 2.5rem; text-align:center; }
    .panel::before { content:''; position:absolute; right:-4.5rem; top:-5rem; width:15rem; height:15rem;
                     background:radial-gradient(circle, rgba(255,255,255,.45), transparent 62%); pointer-events:none; }
    .panel::after { content:''; position:absolute; left:-3rem; bottom:-2rem; width:20rem; height:20rem;
                    background:radial-gradient(circle, rgba(232,64,44,.12), transparent 55%); pointer-events:none; }
    .eyebrow { display:inline-flex; margin-bottom:1.25rem; padding:.55rem 1rem;
               border-radius:999px; background:rgba(194,24,7,.08); color:#C21807;
               font-size:.72rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    .code { position:relative; font-size:98px; margin:0; line-height:1; letter-spacing:-0.04em;
            color:transparent; font-weight:800; background:linear-gradient(145deg, #C21807, #ffffff 34%, #C21807 72%);
            -webkit-background-clip:text; background-clip:text; }
    .code::after { content:''; position:absolute; left:50%; top:42%; width:8rem; height:1.1rem;
                  background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.8) 46%, rgba(255,255,255,0) 100%);
                  transform:translateX(-50%) translateY(-50%); filter:blur(6px); opacity:.75; animation:shine 3.6s linear infinite; }
    @keyframes shine { 0% { transform:translateX(-220%) translateY(-50%); } 100% { transform:translateX(220%) translateY(-50%); } }
    h1 { margin:.75rem 0 0; font-size:2.55rem; line-height:1.05; letter-spacing:-0.03em; }
    p { margin:1.6rem auto 0; max-width:32rem; color:rgba(20,20,20,.62);
        font-size:1rem; line-height:1.8; }
    .actions { margin-top:2.25rem; display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; }
    .button { border-radius:999px; padding:.95rem 2rem; font-size:.95rem;
              text-decoration:none; transition:transform .25s ease, background .25s ease, color .25s ease; }
    .button.primary { background:#C21807; color:#F4F2EF; }
    .button.primary:hover { background:#9C1205; transform:translateY(-1px); }
    .button.ghost { border:1px solid rgba(20,20,20,.15); color:#141414; }
    .button.ghost:hover { border-color:#C21807; color:#C21807; transform:translateY(-1px); }
    .tagline { margin-top:2.5rem; color:rgba(20,20,20,.35); font-size:.75rem; letter-spacing:.24em; }
    @media (max-width:640px) { .panel { padding:2rem 1.75rem; } .code { font-size:82px; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="panel">
      <span class="eyebrow">Server error</span>
      <p class="code">500</p>
      <h1>Our kitchen is temporarily closed.</h1>
      <p>
        Something unexpected happened while we were preparing your request. Refresh the page or try again in a moment.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Back to home</a>
        <a class="button ghost" href="tel:+2348000000000">Call support</a>
      </div>
      <p class="tagline">SAMZIC FOOD EMPIRE</p>
    </div>
  </div>
</body>
</html>
